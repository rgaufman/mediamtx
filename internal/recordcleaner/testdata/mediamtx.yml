  659ffa59a79dfa3a216131ab-browser:
    source: publisher
    runOnDemand: |-
      /bin/sh -c \#\ Map\ the\ proxy\'s\ audio\ only\ when\ packets\ are\ arriving\ on\ it.\ An\ advertised\ track\ with\ no\ packets'
      '\#\ stalls\ ffmpeg\ before\ its\ first\ segment\ \(CameraCmds::STREAM_AUDIO_PROBE_SECONDS\ explains\).'
      'audio_args\=\'-map\ 0:a\?\ -c:a\ aac\''
      'audio_packets\=\$\(timeout\ 20\ /usr/local/bin/ffprobe\ -v\ error\ -rtsp_transport\ tcp\ -select_streams\ a\ -show_entries\ packet\=stream_index\ -of\ csv\=p\=0\ -read_intervals\ \%+5\ rtsp://127.0.0.1:8554/659ffa59a79dfa3a216131ab\ \|\ wc\ -l\)'
      'if\ \[\ \"\$audio_packets\"\ -eq\ 0\ \]\;\ then'
      '\ \ echo\ \"media_audio\ 659ffa59a79dfa3a216131ab:\ no\ audio\ packets\ from\ rtsp://127.0.0.1:8554/659ffa59a79dfa3a216131ab\ in\ 5s\ \(track\ absent,\ silent,\ or\ no\ answer\),\ recording\ video\ only\ \(-an\)\"\ \>\&2'
      '\ \ audio_args\=\'-an\''
      'fi'
      'exec\ /usr/local/bin/ffmpeg\ -nostdin\ -v\ error\ -rtsp_transport\ tcp\ -i\ rtsp://127.0.0.1:8554/659ffa59a79dfa3a216131ab\ -map\ 0:v:0\ -c:v\ copy\ \$audio_args\ -f\ rtsp\ -rtsp_transport\ tcp\ rtsp://127.0.0.1:8554/659ffa59a79dfa3a216131ab-browser
    runOnDemandRestart: true
    runOnDemandStartTimeout: 15s
    runOnDemandCloseAfter: 5s
